function Donut({ habits }) {
  const [hover, setHover] = useState(null);
  const total = habits.length * 7;
  const data = Object.keys(CATS).map(k => {
    const hs = habits.filter(h => h.cat === k);
    return { k, done: hs.reduce((a,h)=>a+h.days.filter(Boolean).length,0), slots: hs.length*7 };
  }).filter(d => d.slots > 0);
  const doneAll = data.reduce((a,d)=>a+d.done,0);
  let off = 0;
  const segs = data.map(d => { const len = total ? d.done/total*100 : 0; const s = { ...d, len, off }; off += len; return s; });
  const info = hover ? data.find(d=>d.k===hover) : null;
  return (
    <div className="flex flex-col sm:flex-row items-center gap-6">
      <div className="relative w-48 h-48 shrink-0">
        <svg viewBox="0 0 36 36" className="w-full h-full -rotate-90">
          <circle cx="18" cy="18" r="15.9155" fill="none" stroke="#27272a" strokeWidth="4.2" />
          {segs.map(s => (
            <circle key={s.k} className="seg cursor-pointer" cx="18" cy="18" r="15.9155" fill="none" stroke={CATS[s.k]}
              strokeWidth={hover===s.k?5.2:4.2} opacity={hover && hover!==s.k ? .35 : 1}
              strokeDasharray={`${Math.max(s.len-.4,0)} ${100-Math.max(s.len-.4,0)}`} strokeDashoffset={-s.off}
              onMouseEnter={()=>setHover(s.k)} onMouseLeave={()=>setHover(null)} onClick={()=>setHover(hover===s.k?null:s.k)} />
          ))}
        </svg>
        <div className="absolute inset-0 flex flex-col items-center justify-center pointer-events-none text-center">
          {info ? (<><span className="text-2xl font-bold" style={{color:CATS[info.k]}}>{info.done}/{info.slots}</span><span className="text-xs text-zinc-400">{info.k}</span></>)
                : (<><span className="text-3xl font-bold">{doneAll}</span><span className="text-xs text-zinc-400">of {total} done</span></>)}
        </div>
      </div>
      <ul className="w-full space-y-2 text-sm">
        {data.map(d => (
          <li key={d.k} onMouseEnter={()=>setHover(d.k)} onMouseLeave={()=>setHover(null)} className="flex items-center justify-between rounded-lg px-3 py-2 bg-zinc-900/60 hover:bg-zinc-800 transition cursor-default">
            <span className="flex items-center gap-2"><i className="w-2.5 h-2.5 rounded-full" style={{background:CATS[d.k]}}/>{d.k}</span>
            <span className="text-zinc-400"><b className="text-zinc-100">{d.done}</b> done · {d.slots-d.done} pending</span>
          </li>
        ))}
        <li className="flex items-center justify-between px-3 text-xs text-zinc-500"><span className="flex items-center gap-2"><i className="w-2.5 h-2.5 rounded-full bg-zinc-700"/>Pending</span><span>{total-doneAll} total</span></li>
      </ul>
    </div>
  );
}

  const allWk = [...hist.weeks.filter(w => inMo(w.date)), ...liveWk];

    setGoals(gs => [...gs, { id:Date.now(), title:g.title.trim(), current:0, target:t, unit:g.unit.trim()||'units', step: t>=20 ? Math.round(t/10) : 1 }]);

  const { pct, done, total, streak } = useMemo(() => {
    const total = habits.length*7, done = habits.reduce((a,h)=>a+h.days.filter(Boolean).length,0);
    let streak = 0; for (let i=todayIdx;i>=0;i--) { if (habits.length && habits.every(h=>h.days[i])) streak++; else break; }
    return { total, done, pct: total ? Math.round(done/total*100) : 0, streak };
  }, [habits]);

  // ---- Cloud sync (Firebase) ----
  const [user, setUser] = useState(null);
  const [sync, setSync] = useState({ status:'' });
  const fbRef = useRef({});
  const applying = useRef(false);
  const lastStr = useRef(null);
  const stamp = useRef(+load('ascend.stamp', 0) || 0);
  const bundleStr = JSON.stringify({ habits, goals, todos, pts, rewards, hist, prof, daily, favq, exams, diet, theme, notes:nb });
  const bundleRef = useRef(bundleStr); bundleRef.current = bundleStr;
  const push = () => {
    const f = fbRef.current; if (!f.db || !f.uid) return;
    setSync({ status:'Saving…' });
    f.db.collection('users').doc(f.uid).set({ data:bundleRef.current, updatedAt:stamp.current, device:f.device })
      .then(() => setSync({ status:'Synced ✓' })).catch(() => setSync({ status:'Sync failed' }));
  };
  const applyBundle = d => {
    const next = { ...JSON.parse(bundleRef.current), ...d };
    if (JSON.stringify(next) === bundleRef.current) return;
    applying.current = true;
    if (d.habits) setHabits(d.habits); if (d.goals) setGoals(d.goals); if (d.todos) setTodos(d.todos); if (d.pts) setPts(d.pts);
    if (d.rewards) setRewards(d.rewards); if (d.hist) setHist(d.hist); if (d.prof) setProf(d.prof); if (d.daily) setDaily(d.daily);
    if (d.favq) setFavq(d.favq); if (d.exams) setExams(d.exams); if (d.diet) setDiet(d.diet); if (d.theme) setTheme({ ...DEF_THEME, ...d.theme }); if (d.notes) setNb(d.notes);
  };
  const applyRemote = c => { try { const d = JSON.parse(c.data); stamp.current = c.updatedAt; save('ascend.stamp', c.updatedAt); applyBundle(d); } catch {} };
  useEffect(() => {
    if (lastStr.current === null) { lastStr.current = bundleStr; return; }
    if (lastStr.current === bundleStr) return;
    lastStr.current = bundleStr;
    if (applying.current) { applying.current = false; return; }
    stamp.current = Date.now(); save('ascend.stamp', stamp.current);
    if (fbRef.current.uid) { clearTimeout(fbRef.current.t); fbRef.current.t = setTimeout(push, 1500); }
  }, [bundleStr]);
  useEffect(() => {

    try {
      if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
      const f = fbRef.current; f.auth = firebase.auth(); f.db = firebase.firestore(); f.device = Math.random().toString(36).slice(2);
      return f.auth.onAuthStateChanged(u => {
        setUser(u); f.uid = u ? u.uid : null;
        if (f.unsub) { f.unsub(); f.unsub = null; }
        if (!u) { setSync({ status:'' }); return; }
        let first = true;
        f.unsub = f.db.collection('users').doc(u.uid).onSnapshot(snap => {
          const c = snap.exists ? snap.data() : null;
          if (first) { first = false; if (c && c.updatedAt > stamp.current) applyRemote(c); else push(); }
          else if (c && c.device !== f.device && c.updatedAt > stamp.current) applyRemote(c);
          setSync({ status:'Synced ✓' });
        }, () => setSync({ status:'Sync error' }));
      });
    } catch { setSync({ status:'Sync unavailable' }); }
  }, []);
  const signIn = () => { const a = fbRef.current.auth; if (!a) { alert('Cloud sync could not start. Check your connection and the Firebase config.'); return; } const pr = new firebase.auth.GoogleAuthProvider(); a.signInWithPopup(pr).catch(e => { if (e && /popup/.test(e.code || '')) a.signInWithRedirect(pr); else setSync({ status:'Sign-in failed' }); }); };
  const accountUI = !FIREBASE_CONFIG.apiKey ? null : user

  const life = pts.banked + weekPts;
  const lifeChecks = hist.weeks.reduce((a,w) => a + w.checks, 0) + nChecks;
  const BADGES = [['🔥','7-day perfect streak', streak>=7], ['💯','100 check-ins', lifeChecks>=100], ['⭐','500 lifetime pts', life>=500], ['🎓','10 tasks finished', hist.tasks.length>=10], ['🏆','A goal completed', goals.some(x => x.current>=x.target)], ['🎁','First reward redeemed', hist.redeemed.length>0], ['📝','10 notes saved', nb.items.length>=10]];

          <label className="block text-xs uppercase tracking-wider text-zinc-500 mt-4">Why I started</label>
          <textarea rows="2" className={inp+" w-full mt-1 resize-none"} placeholder="Write the reason you began. Read it on hard days." value={prof.why} onChange={e=>setProf({ ...prof, why:e.target.value })}/>
        </div>
        <div className="card p-5 xl:col-span-2 !border-emerald-400/25 bg-gradient-to-br from-emerald-400/5 to-cyan-400/5">

        </div>
      </section>
      <section className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">

        {[['today','☀️ Today'], ['goals','🎯 Goals & Rewards'], ['notes','📝 Notes & AI'], ['diet','🥗 Diet'], ['review','📊 Review'], ['theme','🎨 Theme']].map(([k,l]) => (
          <button key={k} onClick={()=>setTab(k)} className={"whitespace-nowrap px-4 py-2 rounded-lg text-sm font-medium transition "+(tab===k?'bg-emerald-400 text-zinc-950':'text-zinc-400 hover:text-zinc-100 hover:bg-zinc-800')}>{l}</button>))}
      </nav>

      {tab==='today' && (
        <div className="grid grid-cols-1 xl:grid-cols-5 gap-4 items-start">
          <div className="xl:col-span-3 space-y-4">
            <label className="flex items-center justify-between gap-3 rounded-xl border border-zinc-800 bg-zinc-900/50 px-4 py-2.5 text-sm cursor-pointer">
              <span><b>Rough-day mode</b> <span className="text-zinc-500">Do your top 2 habits and call the day a win. The rest fade out.</span></span>
              <input type="checkbox" checked={rough} onChange={e=>setRough(e.target.checked)} className="accent-emerald-400 w-4 h-4"/>
            </label>
      <section className="card p-4 sm:p-6">
        <h2 className="text-lg font-semibold mb-4">Weekly habit grid</h2>
        <div className="overflow-x-auto">
          <table className="w-full min-w-[640px] text-sm">
            <thead><tr className="text-zinc-500 text-xs uppercase">
              <th className="text-left font-medium pb-3">Habit</th>
              {DAYS.map((d,i)=><th key={d} className={"pb-3 font-medium "+(i===todayIdx?'text-emerald-300':'')}>{d}</th>)}
              <th className="pb-3 w-28 font-medium">Progress</th><th className="w-8"/>
            </tr></thead>
            <tbody>
              {habits.map(h => { const n = h.days.filter(Boolean).length; return (
                <tr key={h.id} className={"border-t border-zinc-800/80 transition-opacity "+(rough && habits.indexOf(h)>1 ? "opacity-30" : "")}>
                  <td className="py-3 pr-3"><div className="font-medium">{h.name}</div><div className="text-xs" style={{color:CATS[h.cat]}}>{h.cat}</div></td>
                  {h.days.map((v,i)=>(
                    <td key={i} className="text-center">
                      <button onClick={()=>toggle(h.id,i)} aria-label={`${h.name} ${DAYS[i]}`}
                        className={"w-8 h-8 rounded-lg border inline-flex items-center justify-center transition-all duration-200 active:scale-90 "+(v?'bg-emerald-400 border-emerald-300 text-zinc-950 glow':'border-zinc-700 hover:border-emerald-500/60 text-transparent hover:text-emerald-500/40')+(i===todayIdx&&!v?' ring-1 ring-emerald-400/40':'')}>
                        <Icon d={P.check} size={16}/></button>
                    </td>))}
                  <td className="px-2"><div className="h-2 bg-zinc-800 rounded-full overflow-hidden"><div className="bar h-full rounded-full" style={{width:n/7*100+'%',background:CATS[h.cat]}}/></div><div className="text-[11px] text-zinc-500 mt-1 text-right">{n}/7</div></td>
                  <td><button onClick={()=>setHabits(hs=>hs.filter(x=>x.id!==h.id))} className="text-zinc-600 hover:text-red-400 transition p-1" aria-label="Delete habit"><Icon d={P.trash} size={16}/></button></td>
                </tr>);})}
              {!habits.length && <tr><td colSpan="10" className="py-8 text-center text-zinc-500">No habits yet — add one below.</td></tr>}
            </tbody>
          </table>
        </div>
        <div className="flex flex-wrap gap-2 mt-5">

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  {[['Calories','kcal','kcal','#34d399'], ['Protein','p','g','#22d3ee'], ['Carbs','c','g','#a3e635'], ['Fat','f','g','#fbbf24']].map(([l,k,u,col]) => { const t = Math.round(sumOf(dlog.result,k)), g = Math.round(+(dlog.result.targets||{})[k] || 0), pc = g ? Math.min(100, Math.round(t/g*100)) : 0; return (
                    <div key={k}><div className="flex justify-between text-sm mb-1"><span>{l}</span><span className="text-zinc-400"><b className="text-zinc-100">{t}</b> / {g || '?'} {u}</span></div><div className="h-2.5 bg-zinc-800 rounded-full overflow-hidden"><div className="bar h-full rounded-full" style={{width:pc+'%', background:col}}/></div></div>);})}
                </div>
                {dlog.result.summary && <p className="text-sm text-zinc-300 mt-4">{dlog.result.summary}</p>}
                {dlog.analyzedText !== dlog.text && <p className="text-xs text-amber-300 mt-2">You changed the food log since this analysis. Press the button again to update it.</p>}
              </section>
              <section className="card p-4 sm:p-6">
                <h2 className="text-lg font-semibold mb-3">Breakdown</h2>
                <div className="overflow-x-auto"><table className="w-full text-sm min-w-[420px]"><thead><tr className="text-xs uppercase text-zinc-500"><th className="text-left font-medium pb-2">Food</th><th className="font-medium pb-2">kcal</th><th className="font-medium pb-2">P</th><th className="font-medium pb-2">C</th><th className="font-medium pb-2">F</th></tr></thead>
                  <tbody>{(dlog.result.items || []).map((x,i) => <tr key={i} className="border-t border-zinc-800/80"><td className="py-2 pr-2">{x.food}</td><td className="text-center">{Math.round(+x.kcal||0)}</td><td className="text-center">{Math.round(+x.p||0)}g</td><td className="text-center">{Math.round(+x.c||0)}g</td><td className="text-center">{Math.round(+x.f||0)}g</td></tr>)}</tbody></table></div>
              </section>
              <section className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div className="card p-4 sm:p-6 !border-red-400/30"><h2 className="text-lg font-semibold mb-3 text-red-300">Cut or swap</h2><ul className="space-y-2 text-sm text-zinc-300">{(dlog.result.cut || []).map((x,i) => <li key={i}>– {String(x)}</li>)}{!(dlog.result.cut || []).length && <li className="text-zinc-500">Nothing to cut. Nice.</li>}</ul></div>
                <div className="card p-4 sm:p-6 !border-emerald-400/30"><h2 className="text-lg font-semibold mb-3 text-emerald-300">Add</h2><ul className="space-y-2 text-sm text-zinc-300">{(dlog.result.add || []).map((x,i) => <li key={i}>+ {String(x)}</li>)}{!(dlog.result.add || []).length && <li className="text-zinc-500">You're covered.</li>}</ul></div>
              </section>
              {dlog.result.note && <div className="rounded-xl border border-amber-300/40 bg-amber-300/5 p-4 text-sm text-amber-100">{dlog.result.note}</div>}
            </>) : <section className="card p-6 text-sm text-zinc-500">Fill in your profile, list what you ate, and your macro breakdown and advice will appear here.</section>}
            <section className="card p-4 sm:p-6">
              <h2 className="text-lg font-semibold mb-3">Recent days</h2>
              <ul className="space-y-1 text-sm">
                {Object.entries(diet.logs).filter(([d,l]) => l.result && d !== todayStr).sort((a,b) => b[0].localeCompare(a[0])).slice(0,7).map(([d,l]) => <li key={d} className="flex justify-between text-zinc-300"><span>{d}</span><span className="text-zinc-400">{Math.round(sumOf(l.result,'kcal'))} kcal · {Math.round(sumOf(l.result,'p'))}g protein · {Math.round(sumOf(l.result,'c'))}g carbs · {Math.round(sumOf(l.result,'f'))}g fat</span></li>)}
                {!Object.values(diet.logs).filter(l => l.result).length && <li className="text-zinc-500">Past days will appear here once you analyze them.</li>}
              </ul>
            </section>
          </div>
        </div>)}

      {tab==='theme' && (
        <>
        <section className="card p-4 sm:p-6">
          <h2 className="text-lg font-semibold mb-3">Theme packs</h2>
          <div className="grid grid-cols-2 lg:grid-cols-4 gap-2">
            {PACKS.map(([n,t]) => <button key={n} onClick={()=>setTheme({ ...DEF_THEME, ...t })} className="text-left rounded-xl border border-zinc-800 hover:border-emerald-400 px-3 py-3 text-sm transition"><span className="flex mb-2"><i className="w-4 h-4 rounded-full" style={{background:t.p}}/><i className="w-4 h-4 rounded-full -ml-1" style={{background:t.s}}/></span><div className="font-semibold">{n}</div><div className="text-xs text-zinc-500">{t.title}</div></button>)}
          </div>
          <p className="text-xs text-zinc-500 mt-3">A pack sets colors, font, picture and title together, and you can tweak anything afterwards. Shadow Monarch is an original dark-fantasy look. To use your own artwork, upload it as the banner picture.</p>
        </section>
        <div className="grid grid-cols-1 xl:grid-cols-2 gap-4 items-start">
          <section className="card p-4 sm:p-6 space-y-4">
            <h2 className="text-lg font-semibold">Banner & titles</h2>
            <label className="block text-xs text-zinc-500">Banner quote<input className={inp+" w-full mt-1"} value={theme.title} onChange={e=>setTh({ title:e.target.value })}/></label>
            <label className="flex items-center gap-2 text-sm text-zinc-300"><input type="checkbox" className="accent-emerald-400 w-4 h-4" checked={theme.quotes} onChange={e=>setTh({ quotes:e.target.checked })}/>Wrap it in quotation marks</label>
            <label className="flex items-center gap-2 text-sm text-zinc-300"><input type="checkbox" className="accent-emerald-400 w-4 h-4" checked={theme.look==='system'} onChange={e=>setTh({ look:e.target.checked ? 'system' : '' })}/>Glowing "system window" panels</label>
            <label className="block text-xs text-zinc-500">App name (shown above the tabs)<input className={inp+" w-full mt-1"} value={theme.name} onChange={e=>setTh({ name:e.target.value })}/></label>
            <div>
              <div className="text-xs text-zinc-500 mb-2">Banner font</div>
              <div className="flex flex-wrap gap-2">{[['serif','Elegant serif'], ['sans','Bold sans'], ['mono','Typewriter'], ['cursive','Cursive'], ['gothic','Gothic'], ['epic','Epic'], ['system','Futuristic']].map(([k,l]) => <button key={k} onClick={()=>setTh({ font:k })} className={"px-3 py-1.5 rounded-lg text-sm border transition "+(theme.font===k?'border-emerald-400 bg-emerald-400/10':'border-zinc-700 hover:border-zinc-500')}>{l}</button>)}</div>
            </div>
            <div>
              <div className="text-xs text-zinc-500 mb-2">Banner picture</div>
              <div className="flex flex-wrap gap-2">
                {[['mountain','Mountain climb'], ['shadow','Shadow monarch'], ['none','Gradient only']].map(([k,l]) => <button key={k} onClick={()=>setTh({ scene:k })} className={"px-3 py-1.5 rounded-lg text-sm border transition "+(theme.scene===k?'border-emerald-400 bg-emerald-400/10':'border-zinc-700 hover:border-zinc-500')}>{l}</button>)}
                <label className={"px-3 py-1.5 rounded-lg text-sm border transition cursor-pointer "+(theme.scene==='image'?'border-emerald-400 bg-emerald-400/10':'border-zinc-700 hover:border-zinc-500')}>Upload your own<input type="file" accept="image/*" className="hidden" onChange={onBannerImg}/></label>
                {bannerImg && <button onClick={clearBannerImg} className="px-3 py-1.5 rounded-lg text-sm border border-zinc-800 text-zinc-500 hover:text-red-400 transition">Remove my image</button>}
              </div>
              <p className="text-xs text-zinc-500 mt-2">Wide images (about 3:1) work best. Your uploaded image stays on this device and isn't synced to other devices.</p>
            </div>
          </section>
          <section className="card p-4 sm:p-6 space-y-4">
            <h2 className="text-lg font-semibold">Colors</h2>
            <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
              {PRESETS.map(([n,a,b]) => <button key={n} onClick={()=>setTh({ preset:n, p:a, s:b })} className={"flex items-center gap-2 rounded-xl border px-3 py-2 text-sm transition "+(theme.preset===n?'border-emerald-400 bg-emerald-400/10':'border-zinc-800 hover:border-zinc-600')}><span className="flex"><i className="w-4 h-4 rounded-full" style={{background:a}}/><i className="w-4 h-4 rounded-full -ml-1" style={{background:b}}/></span>{n}</button>)}
            </div>
            <div className="flex flex-wrap items-center gap-4 text-sm text-zinc-300">
              <label className="flex items-center gap-2">Main color <input type="color" value={theme.p} onChange={e=>setTh({ p:e.target.value, preset:'Custom' })} className="w-10 h-8 bg-transparent cursor-pointer"/></label>
              <label className="flex items-center gap-2">Accent color <input type="color" value={theme.s} onChange={e=>setTh({ s:e.target.value, preset:'Custom' })} className="w-10 h-8 bg-transparent cursor-pointer"/></label>
            </div>
            <button onClick={()=>setTheme(DEF_THEME)} className="text-sm text-zinc-500 hover:text-emerald-300 transition">Reset everything to default</button>
            <p className="text-xs text-zinc-500">Changes show instantly in the banner above and sync to your other devices when you're signed in.</p>
          </section>
        </div></>)}

      {tab==='review' && (
        <div className="grid grid-cols-1 xl:grid-cols-3 gap-4 items-start">
          <div className="space-y-4">
      <section className="card p-4 sm:p-6">
        <h2 className="text-lg font-semibold mb-4">Completion by category <span className="text-xs text-zinc-500 font-normal ml-1">hover a slice</span></h2>
        <Donut habits={habits}/>
      </section>
            <section className="card p-4 sm:p-6">
              <h2 className="text-lg font-semibold mb-3">Milestones</h2>
              <div className="flex flex-wrap gap-2">
                {BADGES.map(([ic,l,ok]) => <span key={l} className={"text-xs rounded-full px-3 py-1.5 border "+(ok?'border-emerald-400/60 bg-emerald-400/10 text-emerald-200':'border-zinc-800 text-zinc-600')}>{ic} {l}</span>)}
              </div>
            </section>
            <section className="card p-4 sm:p-6">
              <h2 className="text-lg font-semibold mb-3">Wins this week</h2>
              <ul className="space-y-1 text-sm text-zinc-300">{wins.map((w,i) => <li key={i}>{w}</li>)}</ul>
            </section>
            <section className="card p-4 sm:p-6">
              <h2 className="text-lg font-semibold mb-3">Saved quotes</h2>
              <ul className="space-y-3 text-sm">
                {favq.map(i => QUOTES[i] && (
                  <li key={i} className="border-l-2 border-emerald-400/60 pl-3"><div className="font-medium">“{QUOTES[i][0]}”</div><div className="text-xs text-cyan-200 mt-1">{QUOTES[i][1]}</div><button onClick={()=>setFavq(f=>f.filter(x=>x!==i))} className="text-xs text-zinc-600 hover:text-red-400 mt-1 transition">remove</button></li>))}
                {!favq.length && <li className="text-zinc-500">Tap ☆ Save on a quote to keep it here.</li>}
              </ul>
            </section>
          </div>
          <div className="xl:col-span-2">
      <section className="card p-4 sm:p-6 !border-cyan-400/30">
        <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
          <h2 className="text-lg font-semibold">Monthly check-up <span className="text-sm text-zinc-500 font-normal ml-1">{monthLabel}</span></h2>
          <input type="month" className={inp} value={mo} onChange={e=>{ setMo(e.target.value || todayStr.slice(0,7)); setMrep({ busy:false, text:'', err:'' }); }}/>
        </div>
        <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
          {[['Completion', mRate+'%', 'text-emerald-400'], ['Check-ins', mChecks+' / '+mSlots, 'text-zinc-100'], ['Points earned', mPts+' pts', 'text-amber-300'], ['Tasks done', mTasks.length, 'text-cyan-300']].map(([l,v,c]) => (
            <div key={l} className="rounded-xl bg-zinc-900/60 border border-zinc-800 p-4"><div className="text-xs uppercase tracking-wider text-zinc-500">{l}</div><div className={"text-2xl font-bold mt-1 "+c}>{v}</div></div>))}
        </div>
        <p className="text-xs text-zinc-500 mt-2">{mPerfect} perfect days · {mSpent} pts spent on rewards · net {mPts-mSpent} pts. A week is counted when you press "New week"{isCur ? '; the current week is included live.' : '.'}</p>
        <h3 className="text-sm font-semibold mt-5 mb-2">Habits</h3>
        <div className="space-y-2">
          {habitRows.map(r => { const p = Math.round(r.n/r.slots*100); return (
            <div key={r.name}><div className="flex justify-between text-xs mb-1"><span>{r.name}</span><span className="text-zinc-400">{r.n}/{r.slots} · {p}%</span></div><div className="h-2 bg-zinc-800 rounded-full overflow-hidden"><div className="bar h-full rounded-full" style={{width:p+'%', background:CATS[r.cat]||'#34d399'}}/></div></div>);})}
          {!habitRows.length && <div className="text-sm text-zinc-500">No habit data for this month yet.</div>}
        </div>
        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mt-5 text-sm">
          <div><h3 className="font-semibold mb-2">Coursework completed</h3><ul className="space-y-1 max-h-48 overflow-y-auto">{mTasks.map(t => <li key={t.id} className="text-zinc-300">✓ {t.text}{t.course && <span className="text-cyan-300"> · {t.course}</span>}</li>)}{!mTasks.length && <li className="text-zinc-500">None logged.</li>}</ul></div>
          <div><h3 className="font-semibold mb-2">Rewards redeemed</h3><ul className="space-y-1">{mRedeemed.map((r,i) => <li key={i} className="text-zinc-300">🎁 {r.name} <span className="text-zinc-500">(−{r.cost})</span></li>)}{!mRedeemed.length && <li className="text-zinc-500">None this month.</li>}</ul></div>
          <div><h3 className="font-semibold mb-2">Notes taken</h3><ul className="space-y-1">{nb.names.map((n,i) => <li key={i} className="text-zinc-300">{n||'Untitled'}: <b>{mNotes.filter(x=>x.course===i).length}</b></li>)}</ul></div>
          <div><h3 className="font-semibold mb-2">Goals (current)</h3><ul className="space-y-1">{goals.map(x => <li key={x.id} className="text-zinc-300">{x.title} <span className="text-emerald-300">{Math.round(x.current/x.target*100)}%</span></li>)}{!goals.length && <li className="text-zinc-500">No goals set.</li>}</ul></div>
        </div>
        <div className="mt-6 rounded-xl border border-emerald-400/30 bg-emerald-400/5 p-4">
          <div className="flex flex-wrap items-center justify-between gap-2">
            <h3 className="font-semibold text-emerald-300">AI monthly report</h3>
            <button disabled={mrep.busy} onClick={genReport} className="px-3 py-2 rounded-lg text-sm bg-emerald-400 text-zinc-950 font-semibold hover:bg-emerald-300 disabled:opacity-50 transition">Generate month report</button>
          </div>
          <p className="text-xs text-zinc-500 mt-1">Summarizes each course's notes from this month, reviews your habits and points, and suggests next month's focus. Uses the key from AI settings in Course notes.</p>
          {(mrep.busy || mrep.text || mrep.err) && (
            <div className="mt-4 rounded-lg bg-zinc-950/70 border border-zinc-800 p-4">
              {mrep.err ? <div className="text-sm text-red-400">{mrep.err}</div> : <div className="text-sm whitespace-pre-wrap break-words leading-relaxed">{mrep.text || 'Thinking…'}</div>}
            </div>)}
        </div>
      </section>
          </div>
        </div>)}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
